name: CI

on:
  push:
    branches: [develop, test, main]
  pull_request:
    branches: [test, main]
  workflow_dispatch:

# 同一分支的新提交会取消上一次未跑完的流水线，省额度也避免看到过期结论
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 代码质量（ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装 ruff
        run: pip install "ruff>=0.6"

      - name: 静态检查
        run: ruff check . --output-format=github

      - name: 格式检查（只查不改）
        run: ruff format --check .

  test:
    name: 单元测试（py${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 单元测试全部离线：不调模型、不连数据库、不需要 API Key。
      # 一旦某天测试开始依赖外部服务，这一步就会在 CI 上暴露出来。
      - name: 跑测试并统计覆盖率
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: 镜像可构建
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 只验证能构建，不推送：PR 阶段不需要镜像，推镜像放在发布流程里
      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zhiyuan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
